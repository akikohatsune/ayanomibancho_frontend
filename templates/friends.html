<div class="settings-container">
    <div class="settings-header" style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
        <div>
            <h1 class="settings-title">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Friends & Mutuals</span>
            </h1>
            <p class="settings-subtitle">Manage your friends, mutual connections, and community members.</p>
        </div>

        <!-- Add friend box -->
        <div style="display: flex; gap: 0.5rem; align-items: center; max-width: 420px; width: 100%;">
            <input type="text" id="addFriendInput" class="input-glass" placeholder="Enter username or player ID..." style="flex: 1; padding: 0.55rem 0.9rem; font-size: 0.9rem;" onkeydown="if(event.key==='Enter')handleAddFriend()">
            <button type="button" class="btn btn-primary" onclick="handleAddFriend()" style="padding: 0.55rem 1.2rem; font-size: 0.9rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.4rem;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>Add Friend</span>
            </button>
        </div>
    </div>

    <!-- Navigation Filter Tabs -->
    <div class="settings-tabs-bar" style="margin-bottom: 1.5rem;">
        <button type="button" class="settings-tab-btn active" id="tabFilterAll" onclick="filterFriends('all', this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <span>All ({{FRIENDS_COUNT}})</span>
        </button>
        <button type="button" class="settings-tab-btn" id="tabFilterMutual" onclick="filterFriends('mutual', this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="color: #f472b6;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>Mutual Friends ({{MUTUAL_COUNT}})</span>
        </button>
    </div>

    <!-- Friends Grid -->
    <div id="friendsListContainer">
        {{FRIENDS_GRID_HTML}}
    </div>
</div>

<div id="friendsToast" class="profile-toast"></div>
